<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风险提示函 · 风险图谱</title>
  <link rel="stylesheet" href="./workspace.css">
  <script defer src="./workspace.js"></script>
</head>
<body>
  <header class="bar">
    <nav role="tablist" aria-label="图表切换">
      <a role="tab" id="tab-letter" href="#letter" aria-controls="letter" aria-selected="true">风险提示函</a>
      <a role="tab" id="tab-architecture" href="#architecture" aria-controls="architecture" aria-selected="false" tabindex="-1">智能体架构</a>
    </nav>
    <button id="log-toggle" type="button" aria-controls="workspace" aria-expanded="false">工作记录</button>
  </header>
  <main>
    <section id="letter" role="tabpanel" aria-labelledby="tab-letter">
      <iframe title="风险提示函到行社风险问题" src="./diagrams/risk-letter.html" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
    </section>
    <section hidden id="architecture" role="tabpanel" aria-labelledby="tab-architecture">
      <iframe title="风险提示智能体当前架构" data-src="./diagrams/risk-agent.html" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
    </section>
  </main>
  <aside id="workspace" aria-labelledby="workspace-title">
    <header class="repo">
      <h2 id="workspace-title"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M18 9.5c0 5.5-6 6-12 6"/></svg>Git 工作区</h2>
      <a class="repo-link" href="https://github.com/yuanj8699/risk-agent-diagrams" target="_blank" rel="noopener">risk-agent-diagrams ↗</a>
    </header>
    <div class="records">
      <div class="records-heading">
        <h3>工作记录</h3>
        <a href="https://github.com/yuanj8699/risk-agent-diagrams/edit/main/WORKLOG.md" target="_blank" rel="noopener">编辑记录 ↗</a>
      </div>
      <div class="log">
        {% capture worklog %}{% include_relative WORKLOG.md %}{% endcapture %}
        {{ worklog | markdownify }}
      </div>
    </div>
    <footer><a href="https://github.com/yuanj8699/risk-agent-diagrams/commits/main/" target="_blank" rel="noopener">查看 Git 提交历史 ↗</a></footer>
  </aside>
